name: Continuous Integration

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test 2>&1 | tee test-output.log

      - name: Build
        run: npm run build

      - name: Upload Frontend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-tests
          path: |
            test-output.log
            dist/**

  # Playwright needs a running gateway + services. PR CI runs lint/unit/build only.
  # Nightly (or manual workflow_dispatch) runs E2E and uploads the HTML report for asdos.
  e2e-nightly:
    name: Playwright E2E (nightly / manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        continue-on-error: true
        env:
          E2E_BASE_URL: ${{ vars.BIDMART_E2E_BASE_URL || 'https://bidmart-frontend.vercel.app' }}
          E2E_GATEWAY_URL: ${{ vars.BIDMART_E2E_GATEWAY_URL || 'https://bidmart-staging.43.157.208.68.sslip.io' }}
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: |
            playwright-report/**
            test-results/**

  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=src
            -Dsonar.tests=.
            -Dsonar.test.inclusions=*.contract.test.mjs
            -Dsonar.exclusions=dist/**,node_modules/**,coverage/**,artifacts/**,e2e/**,public/**
            -Dsonar.test.exclusions=e2e/**,public/**
